<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diagrama de Tiempo UML 2.5 - CU-011</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .ea-font {
      font-family: 'Segoe UI', Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 p-4 flex flex-col items-center justify-center">

  <div class="w-full max-w-5xl bg-white p-4 border border-slate-300 rounded shadow-md">
    
    <div class="overflow-x-auto bg-white flex justify-center py-1">
      <svg viewBox="0 0 960 460" class="w-full h-auto select-none" xmlns="http://www.w3.org/2000/svg">
        
        <!-- ========================================================================= -->
        <!-- 1. MARCO EXTERIOR DEL DIAGRAMA (EA Diagram Frame)                         -->
        <!-- ========================================================================= -->
        <rect x="5" y="5" width="950" height="445" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
        
        <!-- Pestaña Header Frame -->
        <path d="M 5 5 L 370 5 L 385 24 L 385 32 L 5 32 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
        <text x="12" y="22" class="ea-font font-bold text-[13px] fill-slate-900">
          sd DT - CU-011: Aprobacion y Ciclo de Vida de Orden
        </text>

        <!-- ========================================================================= -->
        <!-- 2. LIFELINE: ordenCompra (Fondo celeste tenue característico de EA)        -->
        <!-- ========================================================================= -->
        <g transform="translate(40, 50)">
          
          <!-- Contenedor del Lifeline -->
          <rect x="0" y="0" width="880" height="290" fill="#f0f9fa" stroke="#475569" stroke-width="2" rx="3"/>

          <!-- Etiqueta Vertical izquierda (como TimeLine1 en EA) -->
          <g transform="translate(30, 145) rotate(-90)">
            <text x="0" y="0" text-anchor="middle" class="ea-font font-bold text-[13px] fill-slate-800">
              TimeLine1
            </text>
          </g>

          <!-- NIVELES DE ESTADO (Colores aplicados ÚNICAMENTE a los textos de estado) -->
          <!-- Nivel 1: Aprobada (Verde) -->
          <text x="185" y="85" text-anchor="end" class="ea-font font-bold text-[13px] fill-[#16a34a]">Aprobada</text>
          <line x1="195" y1="80" x2="860" y2="80" stroke="#e2e8f0" stroke-width="1"/>

          <!-- Nivel 2: Rechazada (Rojo) -->
          <text x="185" y="140" text-anchor="end" class="ea-font font-bold text-[13px] fill-[#dc2626]">Rechazada</text>
          <line x1="195" y1="135" x2="860" y2="135" stroke="#e2e8f0" stroke-width="1"/>

          <!-- Nivel 3: PendienteAprobacion (Azul) -->
          <text x="185" y="195" text-anchor="end" class="ea-font font-bold text-[13px] fill-[#0284c7]">PendienteAprobacion</text>
          <line x1="195" y1="190" x2="860" y2="190" stroke="#e2e8f0" stroke-width="1"/>

          <!-- Nivel 4: Borrador (Gris) -->
          <text x="185" y="250" text-anchor="end" class="ea-font font-bold text-[13px] fill-[#64748b]">Borrador</text>
          <line x1="195" y1="245" x2="860" y2="245" stroke="#e2e8f0" stroke-width="1"/>

          <!-- ========================================================================= -->
          <!-- 3. COMPONENTES: DURATION CONSTRAINT & EVENTO DIRECTO (Sin recuadro)       -->
          <!-- ========================================================================= -->
          
          <!-- Restricción de Duración estilo EA: |<--   {t <= 48h (SLA)}   -->| (Sin caja, texto directo) -->
          <g transform="translate(0, 0)">
            <!-- Delimitador izquierdo |<-- en t=8 (x=247) -->
            <line x1="247" y1="35" x2="247" y2="55" stroke="#1e293b" stroke-width="1.5"/>
            <line x1="247" y1="45" x2="265" y2="45" stroke="#1e293b" stroke-width="1.2"/>
            <polyline points="255,41 248,45 255,49" fill="none" stroke="#1e293b" stroke-width="1.2"/>

            <!-- Texto central directo (sin recuadro de color) -->
            <text x="415" y="49" text-anchor="middle" class="ea-font font-bold text-[12px] fill-slate-900">
              {t &le; 48h (SLA Decisión)}
            </text>

            <!-- Delimitador derecho -->| en t=60 (x=585) -->
            <line x1="585" y1="35" x2="585" y2="55" stroke="#1e293b" stroke-width="1.5"/>
            <line x1="585" y1="45" x2="567" y2="45" stroke="#1e293b" stroke-width="1.2"/>
            <polyline points="577,41 584,45 577,49" fill="none" stroke="#1e293b" stroke-width="1.2"/>
          </g>

          <!-- Evento directo en la transición t=8 (sin prefijo "event:") -->
          <text x="252" y="175" class="ea-font font-semibold text-[11px] fill-slate-900">
            enviar a aprobacion {t &le; 5s}
          </text>

          <!-- Evento directo de decisión en t=60 (sin prefijo) -->
          <text x="590" y="70" class="ea-font font-semibold text-[11px] fill-slate-900">
            aprobar compra {RNF-01: &le; 2.0s}
          </text>

          <!-- ========================================================================= -->
          <!-- 4. LÍNEA DE TIEMPO / ONDA (100% NEGRA, UNIFORME DE UN SOLO COLOR)         -->
          <!-- ========================================================================= -->
          <!-- t=0 (x=195) a t=8 (x=247): Borrador (y=245) -->
          <!-- t=8 (x=247): Sube a PendienteAprobacion (y=190) -->
          <!-- t=8 a t=60 (x=585): PendienteAprobacion (y=190) -->
          <!-- t=60 (x=585): Sube a Aprobada (y=80) -->
          <!-- t=60 a t=90 (x=780): Aprobada (y=80) -->
          <!-- t=90 (x=780): Baja a Borrador/Fin (y=245) -->
          <!-- t=90 a t=100 (x=845): Borrador/Fin (y=245) -->
          
          <path d="M 195 245 
                   L 247 245 
                   L 247 190 
                   L 585 190 
                   L 585 80 
                   L 780 80 
                   L 780 245 
                   L 845 245" 
                fill="none" stroke="#000000" stroke-width="1.8" stroke-linejoin="miter"/>

          <!-- ========================================================================= -->
          <!-- 5. REGLA TEMPORAL INFERIOR (0 .. 100)                                     -->
          <!-- ========================================================================= -->
          <g transform="translate(0, 290)">
            <rect x="0" y="0" width="880" height="35" fill="#f8fafc" stroke="#475569" stroke-width="2" rx="1"/>
            
            <!-- Ticks de 0 a 100: Base x=195 (0), Fin x=845 (100). Paso = 32.5 px cada 5 unidades -->
            <!-- 0 -->
            <line x1="195" y1="0" x2="195" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="195" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">0</text>
            
            <!-- 5 -->
            <line x1="227.5" y1="0" x2="227.5" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="227.5" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">5</text>

            <!-- 10 -->
            <line x1="260" y1="0" x2="260" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="260" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">10</text>

            <!-- 15 -->
            <line x1="292.5" y1="0" x2="292.5" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="292.5" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">15</text>

            <!-- 20 -->
            <line x1="325" y1="0" x2="325" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="325" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">20</text>

            <!-- 25 -->
            <line x1="357.5" y1="0" x2="357.5" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="357.5" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">25</text>

            <!-- 30 -->
            <line x1="390" y1="0" x2="390" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="390" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">30</text>

            <!-- 35 -->
            <line x1="422.5" y1="0" x2="422.5" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="422.5" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">35</text>

            <!-- 40 -->
            <line x1="455" y1="0" x2="455" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="455" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">40</text>

            <!-- 45 -->
            <line x1="487.5" y1="0" x2="487.5" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="487.5" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">45</text>

            <!-- 50 -->
            <line x1="520" y1="0" x2="520" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="520" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">50</text>

            <!-- 55 -->
            <line x1="552.5" y1="0" x2="552.5" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="552.5" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">55</text>

            <!-- 60 -->
            <line x1="585" y1="0" x2="585" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="585" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">60</text>

            <!-- 65 -->
            <line x1="617.5" y1="0" x2="617.5" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="617.5" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">65</text>

            <!-- 70 -->
            <line x1="650" y1="0" x2="650" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="650" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">70</text>

            <!-- 75 -->
            <line x1="682.5" y1="0" x2="682.5" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="682.5" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">75</text>

            <!-- 80 -->
            <line x1="715" y1="0" x2="715" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="715" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">80</text>

            <!-- 85 -->
            <line x1="747.5" y1="0" x2="747.5" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="747.5" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">85</text>

            <!-- 90 -->
            <line x1="780" y1="0" x2="780" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="780" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">90</text>

            <!-- 95 -->
            <line x1="812.5" y1="0" x2="812.5" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="812.5" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">95</text>

            <!-- 100 -->
            <line x1="845" y1="0" x2="845" y2="10" stroke="#1e293b" stroke-width="1.2"/>
            <text x="845" y="24" text-anchor="middle" class="ea-font text-[11px] fill-slate-800">100</text>
          </g>

        </g>

      </svg>
    </div>

  </div>

</body>
</html>
