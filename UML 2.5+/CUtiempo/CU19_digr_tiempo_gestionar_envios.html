<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrama de Tiempo UML 2.5 - CU-019 Gestionar Envíos Logísticos</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .diagram-container {
      background-color: #ffffff;
      padding: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 1000px;
    }
    .ea-font {
      font-family: 'Segoe UI', Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="diagram-container">
    <svg viewBox="0 0 960 460" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
      
      <!-- ========================================================================= -->
      <!-- 1. MARCO EXTERIOR DEL DIAGRAMA (Diagram Frame)                            -->
      <!-- ========================================================================= -->
      <rect x="5" y="5" width="950" height="445" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
      
      <!-- Pestaña Header Frame -->

        sd DT - CU-019: Gestionar Envios Logisticos

      <!-- ========================================================================= -->
      <g transform="translate(40, 50)">

            Envio

        </g>

        <text x="185" y="85" text-anchor="end" class="ea-font" font-size="13px" font-weight="bold" fill="#16a34a">Entregado</text>
        <line x1="195" y1="80" x2="860" y2="80" stroke="#e2e8f0" stroke-width="1"/>
